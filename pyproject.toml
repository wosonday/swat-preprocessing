[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swatprep"
version = "0.5.0"
description = "Preprocess raw geospatial and hydro-meteorological data for SWAT/SWAT+ workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "xarray>=2025.6.1",
    "netcdf4>=1.7.3",
    "rasterio>=1.4.4",
]

[project.optional-dependencies]
geo = [
    "rasterio>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

app = [
    "ruamel-yaml>=0.18",
    "streamlit>=1.40",
]

[project.scripts]
swatprep = "swatprep.cli:main"
swatprep-ui = "app.launch:main"
app = "app.launch:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swatprep*", "app*"]

[tool.setuptools.package-data]
# Streamlit pages are plain scripts (no __init__.py); the theme and icons are data files:
# both must ship inside the package so `swatprep-ui` works after `uv tool install`.
app = ["pages/*.py", ".streamlit/config.toml", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
