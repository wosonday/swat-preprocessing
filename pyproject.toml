[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swatprep"
version = "0.2.2"
description = "Preprocess raw geospatial and hydro-meteorological data for SWAT/SWAT+ workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "xarray>=2025.6.1",
    "netcdf4>=1.7.3",
    "rasterio>=1.4.4",
]

[project.optional-dependencies]
geo = [
    "rasterio>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
swatprep = "swatprep.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swatprep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
