# Example config for swatprep (split precip/temp + SWAT+ output).
# Replace the ./data/... paths with your own inputs.
#
# Usage:
#   swatprep validate config.yaml
#   swatprep build config.yaml

project:
  name: "ExampleBasin_2026"
  crs: "EPSG:32648"                  # UTM Zone 48N — change to your basin CRS
  boundary: "./data/boundary.shp"    # project boundary
  output_dir: "./output"
  targets:
    - "swatplus"                     # "swat" | "swatplus" | both

dem:
  path: "./data/dem/hdr.adf"
  output_name: "dem_projected.tif"

landuse:
  raster: "./data/landuse/hdr.adf"
  lookup: "./data/landuse_lookup.csv"
  source_code_col: "LANDUSE_ID"
  swat_code_col: "SWAT_CODE"
  swat_name_col: "SWAT_CODE"

soil:
  raster: "./data/soil/hdr.adf"
  table: "./data/soil_merged.csv"
  soil_key_col: "SOIL_ID"
  output_usersoil: true

weather:
  precip:
    stations: ./data/precip/master_pcp.txt
    data_dir: ./data/climate
  temp:
    stations: ./data/temp/tmp.txt
    data_dir: ./data/climate
  format: "csv"
  variables:
    - "precip"
    - "tmax"
    - "tmin"
  start: "1981-01-01"
  end: "2019-12-31"
  units:
    precip: "mm"
    temperature: "degC"
  missing_policy: "warn"               # "fail" | "warn"

streamflow:
  path: "./data/streamflow/GAUGE01.csv"
  date_col: "date"
  station_id_col: "station_id"
  value_col: "flow"
  units: "m3s"
